server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/docs {
        proxy_pass http://account-api:4242/docs;
    }

    location /api/openapi.json {
        proxy_pass http://account-api:4242/openapi.json;
    }

    location /api/accounts/ {
        proxy_pass http://account-api:4242/account/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-API-Key $http_x_api_key;
    }

    location /api/health {
        proxy_pass http://account-api:4242/health;
    }

    location /map/ {
        proxy_pass http://reactmap:8080/;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location /koji/ {
        proxy_pass http://koji:8080/;
        proxy_set_header Host $host;
    }
}
