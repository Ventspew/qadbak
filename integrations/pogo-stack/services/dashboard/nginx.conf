# Docker embedded DNS — resolve upstreams at request time so missing
# optional services (reactmap/koji) do not crash nginx on startup.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/docs {
        set $account_api account-api:4242;
        proxy_pass http://$account_api/docs;
    }

    location /api/openapi.json {
        set $account_api account-api:4242;
        proxy_pass http://$account_api/openapi.json;
    }

    location /api/accounts/ {
        set $account_api account-api:4242;
        proxy_pass http://$account_api/account/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-API-Key $http_x_api_key;
    }

    location /api/health {
        set $account_api account-api:4242;
        proxy_pass http://$account_api/health;
    }

    location /map/ {
        set $reactmap_upstream reactmap:8080;
        proxy_pass http://$reactmap_upstream/;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location /koji/ {
        set $koji_upstream koji:8080;
        proxy_pass http://$koji_upstream/;
        proxy_set_header Host $host;
    }
}
