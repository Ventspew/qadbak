name: pogo-stack

networks:
  pogo-net:
    driver: bridge

volumes:
  mariadb_data:
  golbat_data:
  redroid_data_1:
  redroid_data_2:
  rotom_logs:
  rotom_jobs:

services:
  mariadb:
    image: mariadb:11
    networks: [pogo-net]
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./services/account-api/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./config/mariadb/02-databases.sql:/docker-entrypoint-initdb.d/02-databases.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    networks: [pogo-net]
    restart: unless-stopped

  account-api:
    build: ./services/account-api
    networks: [pogo-net]
    restart: unless-stopped
    environment:
      DATABASE_URL: mysql+pymysql://${DB_USER}:${DB_PASSWORD}@mariadb:3306/${DB_NAME}
      API_KEY: ${ACCOUNT_API_KEY}
      DASHBOARD_USER: ${DASHBOARD_USER:-admin}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:-change-me-dashboard-password}
      ROTOM_URL: http://rotom:7072
      ROTOM_SECRET: ${ROTOM_SECRET}
    ports:
      - "127.0.0.1:${ACCOUNT_API_PORT:-14242}:4242"
    depends_on:
      mariadb:
        condition: service_healthy

  dashboard:
    build:
      context: ./services/dashboard
    networks: [pogo-net]
    restart: unless-stopped
    environment:
      ACCOUNT_API_KEY: ${ACCOUNT_API_KEY}
      ROTOM_SECRET: ${ROTOM_SECRET}
    ports:
      - "127.0.0.1:${DASHBOARD_PORT:-18080}:8080"
    depends_on:
      - account-api

  koji:
    image: ${KOJI_IMAGE:-ghcr.io/turtiesocks/koji:main}
    networks: [pogo-net]
    restart: unless-stopped
    environment:
      SCANNER_DB_URL: mysql://${DB_USER}:${DB_PASSWORD}@mariadb:3306/golbat
      KOJI_DB_URL: mysql://${DB_USER}:${DB_PASSWORD}@mariadb:3306/koji
      KOJI_SECRET: ${KOJI_BEARER_TOKEN}
      LOG_LEVEL: info
    ports:
      - "127.0.0.1:${KOJI_PORT:-18082}:8080"
    depends_on:
      mariadb:
        condition: service_healthy
    profiles: ["mapping", "android", "ios", "workers", "full"]

  golbat:
    image: ghcr.io/unownhash/golbat:main
    networks: [pogo-net]
    restart: unless-stopped
    volumes:
      - ./config/rendered/golbat.toml:/config.toml:ro
      - golbat_data:/data
    depends_on:
      mariadb:
        condition: service_healthy
      koji:
        condition: service_started
    profiles: ["mapping", "android", "ios", "workers", "full"]

  rotom:
    image: ghcr.io/unownhash/rotomng/rotom-ng:main
    networks: [pogo-net]
    restart: unless-stopped
    command: ["./rotom-ng", "/rotom-ng/configs/rotom.toml"]
    ports:
      - "${ROTOM_DEVICE_PORT:-7070}:7070"
      - "127.0.0.1:${ROTOM_CONTROLLER_PORT:-7071}:7071"
      - "127.0.0.1:${ROTOM_UI_PORT:-7072}:7072"
    volumes:
      - ./config/rendered/rotom.toml:/rotom-ng/configs/rotom.toml:ro
      - rotom_logs:/rotom-ng/logs
      - rotom_jobs:/rotom-ng/jobs
    profiles: ["mapping", "android", "ios", "workers", "full"]

  reactmap:
    image: ${REACTMAP_IMAGE:-ghcr.io/watwowmap/reactmap:v1.27.2}
    networks: [pogo-net]
    restart: unless-stopped
    command: ["yarn", "start"]
    volumes:
      - ./config/rendered/reactmap.local.json:/home/node/server/src/configs/local.json:ro
      - ./config/reactmap/areas.json:/home/node/server/src/configs/areas.json:ro
    ports:
      - "127.0.0.1:${REACTMAP_PORT:-18081}:8080"
    depends_on:
      mariadb:
        condition: service_healthy
      golbat:
        condition: service_started
    profiles: ["mapping", "android", "ios", "workers", "full"]

  poracle:
    image: ghcr.io/jfberry/poracleng:main
    networks: [pogo-net]
    restart: unless-stopped
    volumes:
      - ./config/poracle:/app/config
    depends_on:
      - golbat
    profiles: ["mapping", "android", "ios", "workers", "full"]

  dragonite:
    build: ./services/dragonite
    networks: [pogo-net]
    restart: unless-stopped
    volumes:
      - ./services/dragonite/config:/config
      - ./services/dragonite/binary:/binary:ro
    depends_on:
      - rotom
      - golbat
      - account-api
    profiles: ["mapping", "android", "ios", "workers", "full"]

  redroid-1:
    image: ${REDROID_IMAGE:-redroid/redroid:11.0.0-latest}
    privileged: true
    networks: [pogo-net]
    restart: unless-stopped
    volumes:
      - redroid_data_1:/data
    ports:
      - "127.0.0.1:5555:5555"
    command:
      - androidboot.redroid_gpu_mode=guest
    profiles: ["workers", "full"]

  redroid-2:
    image: ${REDROID_IMAGE:-redroid/redroid:11.0.0-latest}
    privileged: true
    networks: [pogo-net]
    restart: unless-stopped
    volumes:
      - redroid_data_2:/data
    ports:
      - "127.0.0.1:5556:5555"
    command:
      - androidboot.redroid_gpu_mode=guest
    profiles: ["workers", "full"]

  worker-agent:
    build: ./services/worker-agent
    networks: [pogo-net]
    restart: unless-stopped
    environment:
      REDROID_HOSTS: redroid-1:5555,redroid-2:5555
      ANDROID_DEVICES: ${ANDROID_DEVICES:-}
      CONFIG_DIR: /configs
      APK_DIR: /apk
      PUSH_INTERVAL: ${WORKER_PUSH_INTERVAL:-60}
    volumes:
      - ./config/cosmog/rendered:/configs:ro
      - ./services/cosmog/apk:/apk:ro
    depends_on:
      - redroid-1
      - redroid-2
      - rotom
    profiles: ["workers", "full"]

  android-agent:
    build: ./services/worker-agent
    networks: [pogo-net]
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      REDROID_HOSTS: ""
      ANDROID_DEVICES: ${ANDROID_DEVICES:-}
      CONFIG_DIR: /configs
      APK_DIR: /apk
      PUSH_INTERVAL: ${WORKER_PUSH_INTERVAL:-60}
    volumes:
      - ./config/cosmog/rendered:/configs:ro
      - ./services/cosmog/apk:/apk:ro
    depends_on:
      - rotom
    profiles: ["android", "full"]

  ios-agent:
    build: ./services/ios-agent
    networks: [pogo-net]
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      IOS_DEVICES: ${IOS_DEVICES:-}
      IOS_SSH_USER: ${IOS_SSH_USER:-root}
      IOS_SSH_PASSWORD: ${IOS_SSH_PASSWORD:-}
      CONFIG_DIR: /configs
      PUSH_INTERVAL: ${WORKER_PUSH_INTERVAL:-60}
    volumes:
      - ./config/exeggcute/rendered:/configs:ro
    depends_on:
      - rotom
    profiles: ["ios", "full"]

  houndour:
    build: ./services/houndour
    networks: [pogo-net]
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      ROTOM_URL: ws://rotom:7070
      CHECK_INTERVAL: ${HOUNDOUR_INTERVAL:-120}
      REDROID_CONTAINERS: pogo-stack-redroid-1-1 pogo-stack-redroid-2-1
    depends_on:
      - rotom
      - redroid-1
    profiles: ["workers", "full"]
